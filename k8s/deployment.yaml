apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-trader-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apex-trader-api
  template:
    metadata:
      labels:
        app: apex-trader-api
    spec:
      containers:
        - name: api
          image: apex-trader:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: apex-trader-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
