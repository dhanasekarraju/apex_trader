# Apex Trader on tn88seval.in — copy to /etc/nginx/sites-enabled/tn88seval
# Backend: docker api on 127.0.0.1:8080
# Dashboard: https://tn88seval.in/apex/
# Kite callback: https://tn88seval.in/apex/api/kite/callback

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tn88seval.in www.tn88seval.in 103.194.228.130;

    root /var/www/tn88seval;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/tn88seval.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tn88seval.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /apex {
        return 301 /apex/;
    }

    location /apex/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    if ($host = www.tn88seval.in) {
        return 301 https://$host$request_uri;
    }
    if ($host = tn88seval.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name tn88seval.in www.tn88seval.in 103.194.228.130;
    return 404;
}
