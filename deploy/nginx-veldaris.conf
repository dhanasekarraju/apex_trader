# Apex Trader on veldaris.in — copy to /etc/nginx/sites-enabled/veldaris
# Backend: uvicorn/docker on 127.0.0.1:8090 (host publish; container :8080)
# Dashboard: https://veldaris.in/apex/
# Kite callback: https://veldaris.in/apex/api/kite/callback

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name veldaris.in www.veldaris.in 140.245.232.94;

    root /var/www/veldaris;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/veldaris.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veldaris.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Main website ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── APEX TRADER (host :8090 → container :8080) ──────
    location = /apex {
        return 301 /apex/;
    }

    location /apex/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

# ── HTTP → HTTPS (Certbot) ───────────────────────────────
server {
    if ($host = www.veldaris.in) {
        return 301 https://$host$request_uri;
    }
    if ($host = veldaris.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name veldaris.in www.veldaris.in 140.245.232.94;
    return 404;
}
