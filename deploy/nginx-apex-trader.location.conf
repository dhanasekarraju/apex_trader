# Include inside the existing tn88seval.in HTTPS server block.
    # Apex Trader: separate route, preserving Nautilus at /apex/.
    location = /apex-trader {
        return 301 /apex-trader/;
    }

    location ^~ /apex-trader/ {
        # The application handles its own HTTP Basic / API authentication.
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_cache off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

