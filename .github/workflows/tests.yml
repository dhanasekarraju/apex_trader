name: Safety tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -q
        env:
          TRADING_MODE: paper
          ENABLE_LIVE_EXECUTION: 'false'
          API_ACCESS_KEY: test-api-key-for-ci
          KITE_API_KEY: test
          KITE_API_SECRET: test
